name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run linter
        run: composer lint

      - name: Run tests
        run: composer test
        env:
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET_KEY: ${{ secrets.TOMBA_SECRET_KEY }}
